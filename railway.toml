# ── DashcamIQ — Railway deployment config ─────────────────────────────────────
#
# Deploy the FastAPI backend + Celery worker on Railway.
#
# Setup steps:
#   1. Create a new Railway project
#   2. Add a PostgreSQL plugin  → Railway auto-injects DATABASE_URL
#   3. Add a Redis plugin       → Railway auto-injects REDIS_URL
#   4. Set the env vars below in Railway's Variables panel (from .env.example)
#   5. Push to main → Railway auto-deploys
#
# Required env vars to set manually in Railway:
#   SECRET_KEY, APP_ENV=production,
#   ALLOWED_ORIGINS=https://your-vercel-app.vercel.app,
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
#   R2_BUCKET_NAME, R2_PUBLIC_URL, R2_MAIN_FOLDER,
#   ANTHROPIC_API_KEY
# ────────────────────────────────────────────────────────────────────────────────

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Railway's private network is lazy-initialized and IPv6-only:
#   - preDeployCommand runs with the PUBLIC Postgres URL, so alembic can
#     connect before the service's private network comes up
#   - startCommand binds uvicorn to :: (IPv6) so Railway's healthcheck proxy
#     can reach it over the private network — binding to 0.0.0.0 alone
#     silently fails the /health probe
preDeployCommand = "alembic upgrade head"
startCommand = "uvicorn app:app --host :: --port $PORT --workers 1"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
