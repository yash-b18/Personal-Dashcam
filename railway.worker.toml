# ── DashcamIQ — Railway Celery worker service ─────────────────────────────────
#
# Create a SECOND Railway service in the same project for the Celery worker.
# Point it at this file using Railway's custom start command, or use a separate
# Railway service with dockerfile path set to Dockerfile.worker.
#
# In Railway UI: New Service → GitHub repo → Settings → Dockerfile path:
#   Dockerfile.worker
# ────────────────────────────────────────────────────────────────────────────────

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[deploy]
startCommand = "celery -A api.tasks.celery_app worker --loglevel=info --concurrency=2"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
